plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

def bootBom = org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES

dependencies {
    implementation platform(bootBom)
    annotationProcessor platform(bootBom)
    for (starter in ['webmvc', 'validation', 'data-jpa', 'data-redis', 'cache', 'security', 'actuator', 'flyway']) {
        implementation "org.springframework.boot:spring-boot-starter-${starter}"
    }
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports { xml.required = true }
}
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit { counter = 'LINE'; minimum = 0.81 }
        }
    }
}
check.dependsOn jacocoTestCoverageVerification
jar.enabled = false
bootJar.archiveFileName = 'mediacms.jar'
