spring:
  application:
    name: MediaCmsLab
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://localhost:5432/mediacms
    username: mediacms
    password: mediacms
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false
  cache:
    type: redis
    redis:
      time-to-live: 5m

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  info:
    env:
      enabled: true
info:
  app:
    name: MediaCmsLab
