spring:
  application:
    name: MediaCmsLab
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://localhost:5432/mediacms
    username: mediacms
    password: mediacms
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 500ms
      timeout: 500ms
      repositories:
        enabled: false
  cache:
    type: redis
    redis:
      time-to-live: 5m

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  info:
    env:
      enabled: true
info:
  app:
    name: MediaCmsLab
