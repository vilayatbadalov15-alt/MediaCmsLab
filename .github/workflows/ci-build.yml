name: Build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: java -version
      - run: ./gradlew clean build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: mediacms
          path: build/libs/mediacms.jar
          if-no-files-found: error
